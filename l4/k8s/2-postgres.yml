apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-db-data
  labels:
    app: notes-db
    part-of: notes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-db
  labels:
    app: notes-db
    tier: database
    part-of: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-db
  template:
    metadata:
      labels:
        app: notes-db
        tier: database
        part-of: notes
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notes-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: notes-db
  labels:
    app: notes-db
    part-of: notes
spec:
  selector:
    app: notes-db
  ports:
    - port: 5432
