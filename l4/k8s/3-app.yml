apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  labels:
    app: notes-app
    tier: backend
    part-of: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
        tier: backend
        part-of: notes
    spec:
      initContainers:
        - name: init-db
          image: postgres:17-alpine
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-secret
          command:
            - sh
            - -c
            - >-
              until pg_isready -h $POSTGRES_HOST; do sleep 2; done;
              PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB
              -c 'CREATE TABLE IF NOT EXISTS notes (id SERIAL PRIMARY KEY, text TEXT NOT NULL)'
      containers:
        - name: app
          image: notes-app:4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: notes-app
  labels:
    app: notes-app
    part-of: notes
spec:
  type: NodePort
  selector:
    app: notes-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
